const SUBMIT={
  setupForm:f=>doSetup(f),
  loginForm:async f=>{await doLogin($('#pw').value,$('#keepLogin').checked)},
  ownerGateForm:async f=>{await unlock('owner',$('#pw').value);await loadMonth()},
  dayForm:f=>saveDayForm(f),
  todayForm:f=>saveTodayForm(f),
  mdayForm:f=>saveMDayForm(f),
  revForm:async f=>{const fd=new FormData(f);const std=parseNum(fd.get('std'));await saveMonthDoc({revenue:parseMoney(fd.get('rev')),std:std>0?std:null});toast('Đã cập nhật doanh thu')},
  bankForm:async f=>{const fd=new FormData(f),id=f.dataset.id;const sp={bin:fd.get('bin'),acct:String(fd.get('acct')).replace(/\s/g,''),holder:String(fd.get('holder')).trim().toUpperCase()};await putEnc(P.sp(id),id,sp);S.cache[id].sp=sp;render();toast('Đã lưu tài khoản')},
  pwForm:async f=>{const fd=new FormData(f),id=f.dataset.id;const p1=fd.get('p1');if(p1.length<4)throw uerr('Tối thiểu 4 ký tự');if(p1!==fd.get('p2'))throw uerr('Hai lần nhập không khớp');await rewrapStaff(id,p1);f.reset();toast('Đã đổi mật khẩu')},
  resetForm:async f=>{const fd=new FormData(f),id=f.dataset.id,p=fd.get('p');if(p.length<4)throw uerr('Tối thiểu 4 ký tự');await rewrapStaff(id,p,fd.get('username'));closeModal();if(S.server){S.accounts=await S.user.accounts();render()}toast('Đã đặt lại mật khẩu cho '+staffMeta(id).name)},
  bonForm:async f=>{const fd=new FormData(f),id=fd.get('id');const amt=parseMoney(fd.get('amt'));const reason=String(fd.get('reason')).trim();if(!amt)throw uerr('Nhập số tiền');if(!reason)throw uerr('Bắt buộc có lý do');
    const path=P.bon(id,S.ym);const cur=(await getEnc(path,id))||{items:[]};cur.items.push({type:fd.get('type'),amt,reason,d:fd.get('d'),at:new Date().toISOString()});await putEnc(path,id,cur);S.cache[id].bon=cur.items;render();toast('Đã thêm')},
  reqForm:async f=>{const fd=new FormData(f),id=f.dataset.id;const amt=parseMoney(fd.get('amt'));const reason=String(fd.get('reason')).trim();if(!amt)throw uerr('Nhập số tiền');if(!reason)throw uerr('Bắt buộc có lý do');
    if(S.mdoc.locked[id])throw uerr('Kỳ lương đã chốt');const t=nowParts();
    await mutateReq(id,req=>req.push({rid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:fd.get('type'),amt,reason,d:t.ym===S.ym?S.ym+'-'+pad(t.d):S.ym+'-01',at:t.iso,st:'pending'}));toast('Đã gửi yêu cầu')},
  cfgForm:async f=>{const fd=new FormData(f),g=k=>fd.get(k);const cfg=clone(S.cfg);
    cfg.comm={t1:parseMoney(g('t1')),t2:parseMoney(g('t2')),r1:parsePct(g('r1')),r2:parsePct(g('r2')),r3:parsePct(g('r3')),capPct:parsePct(g('capPct')),cogs:parsePct(g('cogs')),ads:parsePct(g('ads')),damage:parsePct(g('damage')),other:parsePct(g('other'))};
    if(cfg.comm.t2<=cfg.comm.t1)throw uerr('Ngưỡng bậc 2 phải lớn hơn bậc 1');
    const r0=S.cfg.rates||{};cfg.rates={lunch:parseMoney(g('lunch')),satFactor:r0.satFactor,liveDay:parseMoney(g('liveDay')),liveNight:parseMoney(g('liveNight'))};
    cfg.company=String(g('company')).trim()||cfg.company;await dset('cfg/main',cfg);S.cfg=cfg;render();toast('Đã lưu cài đặt')},
  staffForm:async f=>{const fd=new FormData(f),id=f.dataset.id,g=k=>fd.get(k);
    const prev=S.cache[id].sal;const sc=sched(prev);['wd','sat','liveD','liveN',...PG_KEYS].forEach(k=>{if(g(k+'0')&&g(k+'1')){if(toMin(g(k+'1'))<=toMin(g(k+'0')))throw uerr('Giờ kết thúc ca phải sau giờ bắt đầu');sc[k]=[g(k+'0'),g(k+'1')]}});
    const raiseAmt=parseMoney(g('raiseAmt')),raiseFrom=g('raiseFrom')||'';
    if((raiseAmt||raiseFrom)&&!(raiseAmt&&/^\d{4}-\d{2}$/.test(raiseFrom)))throw uerr('Nhập đủ lương mới và tháng áp dụng');
    const raises=(prev.raises||[]).filter(r=>r.from!==raiseFrom);if(raiseAmt)raises.push({from:raiseFrom,monthly:raiseAmt});raises.sort((a,b)=>a.from<b.from?-1:1);
    const sal={sched:sc,kind:g('kind'),monthly:parseMoney(g('monthly')),hourly:parseMoney(g('hourly')),page:parseMoney(g('page')),share:parsePct(g('share')),lunch:!!g('lunch'),live:!!g('live'),raises};
    const others=S.cfg.staff.filter(s=>s.id!==id).reduce((a,s)=>a+(+S.cache[s.id].sal.share||0),0);
    if(others+sal.share>1.0001)throw uerr('Tổng tỷ trọng hoa hồng vượt 100% ('+pct(others+sal.share)+')');
    const sp={bin:g('bin'),acct:String(g('acct')).replace(/\s/g,''),holder:String(g('holder')).trim().toUpperCase()};
    await putEnc(P.sal(id),id,sal);await putEnc(P.sp(id),id,sp);S.cache[id].sal=sal;S.cache[id].sp=sp;
    const st=staffMeta(id);if(st.name!==g('name').trim()||st.title!==g('title').trim()){const cfg=clone(S.cfg);const x=cfg.staff.find(s=>s.id===id);x.name=g('name').trim()||x.name;x.title=g('title').trim();await dset('cfg/main',cfg);S.cfg=cfg}
    render();toast('Đã lưu '+staffMeta(id).name)},
  opwForm:async f=>{const fd=new FormData(f);const p1=fd.get('p1');if(p1.length<6)throw uerr('Tối thiểu 6 ký tự');if(p1!==fd.get('p2'))throw uerr('Hai lần nhập không khớp');
    if(S.server)await S.user.setAccount('owner',{username:fd.get('username'),password:p1,keep:S.keep});
    const cfg=clone(S.cfg);const salt=b64(rand(16));const key=await kdf(p1,salt);cfg.owner={salt,check:await encJSON(key,{ok:1},'owner-check')};
    for(const s of cfg.staff)s.wO=await encBytes(key,S.dkRaw[s.id],'wrap:'+s.id);
    await dset('cfg/main',cfg);S.cfg=cfg;S.ownerKey=key;if(S.keep&&!S.admin)await saveLogin('owner',key);f.reset();
    if(S.server){S.accounts=await S.user.accounts();render()}toast('Đã đổi mật khẩu chủ')}
};
/* the account goes first: a taken username stops here, before the password has changed anywhere */
async function rewrapStaff(id,pw,username){if(S.server)await S.user.setAccount(id,{username,password:pw,keep:S.keep});const salt=b64(rand(16));const kek=await kdf(pw,salt);await dset(P.kw(id),{salt,wS:await encBytes(kek,S.dkRaw[id],'wrap:'+id)});if(S.keep&&S.role===id)await saveLogin(id,kek)}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const fn=ACT[a.dataset.act];if(fn){if(a.tagName==='BUTTON')e.preventDefault();fn(a,e)}});
document.addEventListener('change',e=>{const a=e.target.closest('[data-chg]');if(a&&CHG[a.dataset.chg]&&a.dataset.chg!=='sim')CHG[a.dataset.chg](a)});
document.addEventListener('change',e=>{const r=e.target;if(r.name==='st'&&r.type==='radio'){r.closest('.stbtn').querySelectorAll('label').forEach(l=>l.classList.toggle('sel',l.contains(r)))}});
document.addEventListener('input',e=>{const a=e.target;if(a.dataset&&a.dataset.chg==='sim'){S.simRev=+a.value;const l=$('#simRevLbl');if(l)l.textContent=money(S.simRev)}});
document.addEventListener('change',e=>{const a=e.target;if(a.dataset&&a.dataset.chg==='sim')CHG.sim(a)});
// always block native submit: a GET submit reloads the page and drops the session back to the default tab
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;const key=f.getAttribute('id')||[...f.classList].find(c=>SUBMIT[c]);if(!SUBMIT[key])return;busy(f.querySelector('[type=submit]'),()=>SUBMIT[key](f))});
/* idle logout */
let idleT;function bumpIdle(){clearTimeout(idleT);if(S.role&&!S.keep)idleT=setTimeout(()=>{logout();toast('Đã tự đăng xuất do không thao tác')},IDLE_MIN*60000)}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,bumpIdle,{passive:true}));

if(EMBED)window.addEventListener('storage',e=>{if(e.key==='theme'){document.documentElement.dataset.theme=hostTheme();render();renderModal()}});

/* ================= BRIDGE =================
 * ?embed=1&bridge=1: a hidden frame on the host site's Hôm nay / Tháng pages. It signs in from the remembered login
 * (same as a normal visit), then answers postMessage requests from its parent page, same origin only:
 *   host → {gvg:'att',op:'get',months:['2026-11',…]}      bridge → {gvg:'att',op:'state',signedIn,role,name,kind,days,locked}
 *   host → {gvg:'att',op:'set',date:'2026-11-14',st:'work'} (monthly staff only; st '' clears)  bridge → state, or {op:'error',msg}
 * Same icons as the timekeeping calendar: one shape per day (sh = day % 8), colour by status (Đi làm = the person's tone).
 * days: staff → {date:{sh,st,label,color}}; owner → {date:{sh,people:[{letter,name,st,label,color}]}} (one icon per staff). */
const BRIDGE=!!EMBED&&new URLSearchParams(location.search).has('bridge');
const BRIDGE_COLOR={half:'#D2B055',paid:'#836F9B',off:'#B3BAB6'};
const bridgeColor=(id,st)=>st==='work'?TONE[toneOf(id)].dark:BRIDGE_COLOR[st];
/* first letter of the given name (last word): "Trần Thị Lan" → L */
const nameLetter=n=>((stripVN(n||'').trim().split(/\s+/).pop()||'?')[0]||'?').toUpperCase();
/* one person's mark for a day, or null */
function bridgeMark(id,ym,d){
  const C=S.cache[id];if(!C)return null;const rec=C.days[pad(d)];if(!rec)return null;
  if(C.sal.kind==='month')return rec.st?{st:rec.st,label:STATUS_SHORT[rec.st],color:bridgeColor(id,rec.st)}:null;
  const h=hourDay(rec,C.sal,ym,d),H=h.mainH+h.ldH+h.lnH;
  if(H>0)return{st:'work',label:hrs(H)+' giờ',color:bridgeColor(id,'work')};
  return h.open?{st:'half',label:'Đang làm',color:bridgeColor(id,'half')}:null;
}
function bridgeMonthDays(ym){
  const out={},{n}=ymParts(ym),ids=staffIds();
  for(let d=1;d<=n;d++){
    const date=ym+'-'+pad(d),sh=d%8;
    if(S.role==='owner'){
      const people=ids.map(id=>{const m=bridgeMark(id,ym,d);const nm=staffMeta(id).name;return m&&{...m,name:nm,letter:nameLetter(nm)}}).filter(Boolean);
      if(people.length)out[date]={sh,people};
    }else{const m=bridgeMark(S.role,ym,d);if(m)out[date]={sh,...m}}
  }
  return out;
}
function bridgeLegend(){
  const st=Object.entries(STATUS_SHORT).map(([k,v])=>({st:k,label:v,color:k==='work'&&S.role!=='owner'?bridgeColor(S.role,'work'):BRIDGE_COLOR[k]||null}));
  const people=S.role==='owner'?staffIds().map(id=>{const nm=staffMeta(id).name;return{name:nm,letter:nameLetter(nm),color:bridgeColor(id,'work')}}):[];
  return{statuses:st,people};
}
async function bridgeState(months){
  const base={gvg:'att',op:'state',signedIn:!!S.role,role:S.role||null};
  if(!S.role)return base;
  const days={},locked={};let kind=S.role==='owner'?null:'month';
  for(const ym of months){S.ym=ym;await loadMonth();Object.assign(days,bridgeMonthDays(ym));
    if(S.role!=='owner'){locked[ym]=!canEditDays(S.role);kind=S.cache[S.role]?S.cache[S.role].sal.kind:kind}}
  return{...base,name:S.sso&&S.ssoName?S.ssoName:S.role==='owner'?(S.admin?'Super admin':'Chủ cửa hàng'):staffMeta(S.role).name,kind,days,locked,statuses:STATUS_SHORT,legend:bridgeLegend()};
}
async function bridgeSet(date,st){
  if(!S.role||S.role==='owner')throw uerr('Chỉ nhân viên tự chấm công ở đây');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||(st&&!STATUS[st]))throw uerr('Dữ liệu không hợp lệ');
  const ym=date.slice(0,7),dd=date.slice(8);
  if(dayState(ym,+dd)==='future')throw uerr('Chưa tới ngày này');
  S.ym=ym;await loadMonth();
  if(S.cache[S.role].sal.kind!=='month')throw uerr('Lương giờ: ghi giờ làm ở trang Lương');
  if(!canEditDays(S.role))throw uerr('Kỳ lương đã chốt');
  await mutateDays(S.role,days=>{const o=days[dd]||{};if(st)days[dd]={...o,st,lunch:!!o.lunch,...stamp(dd)};else{const{st:_,...rest}=o;days[dd]={...rest,...stamp(dd)}}});
}
let bridgeQ=Promise.resolve();
function bridgeReady(){
  window.addEventListener('message',e=>{
    if(e.source!==parent||e.origin!==location.origin)return;const m=e.data||{};if(m.gvg!=='att')return;
    const months=(Array.isArray(m.months)?m.months:[]).filter(x=>/^\d{4}-\d{2}$/.test(x)).slice(0,3);
    bridgeQ=bridgeQ.then(async()=>{
      try{if(m.op==='set')await bridgeSet(String(m.date||''),String(m.st||''));parent.postMessage(await bridgeState(months),location.origin)}
      catch(err){parent.postMessage({gvg:'att',op:'error',msg:err.userMsg||err.message||'Lỗi'},location.origin)}
    });
  });
  parent.postMessage({gvg:'att',op:'ready',signedIn:!!S.role},location.origin);
}

/* single sign-on: the host site's account is linked to a payroll account, so no payroll password is asked.
 * The owner link opens every key with the recovery key (as the super admin does); a staff link gets its own key. */
async function ssoLogin(){
  if(!S.server||!S.user.session)return false;
  let s;try{s=await S.user.session()}catch(e){return false}
  if(!s||!s.sso||!s.who)return false;
  S.sso=true;S.ssoName=s.name||'';S.keep=true;S.admin=s.who==='admin';
  await loadCfg();if(!S.cfg)return true;   // not set up yet: the owner link sees the setup form
  try{
    if(S.admin){await unlock('admin');if(!S.role)return true}   // keys not wrapped for recovery yet: owner password gate
    else{const raw=await S.user.myKey();S.dkRaw[s.who]=raw;S.dk[s.who]=await importDK(raw);S.tab='cc';S.role=s.who;S.cache={}}
  }catch(e){console.error(e);toast(e.userMsg||e.message||'Không đăng nhập được phần Lương',true);return true}
  await loadMonth();return true;
}

/* ================= BOOT ================= */
(async function boot(){
  let tries=0;while(!(window.claude&&window.claude.use)&&tries<100){await new Promise(r=>setTimeout(r,100));tries++}
  if(!(window.claude&&window.claude.use)){render();return}
  const[db,user,dl]=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]);
  S.db=db;S.user=user;S.dl=dl;S.isOwnerAcct=!!(user&&user.isOwner&&user.isOwner());S.server=!!(user&&user.login);
  if(!db){render();return}
  if(!S.server)try{await loadCfg()}catch(e){console.error(e);toast('Không tải được cấu hình',true)}
  if(!await ssoLogin()&&(S.cfg||S.server))await restoreLogin();
  render();
  if(BRIDGE)bridgeReady();
})();
